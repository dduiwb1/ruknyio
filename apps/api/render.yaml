services:
  - type: web
    name: rukny-api
    env: node
    region: frankfurt
    plan: starter
    buildCommand: npm install && npx prisma generate && npm run build
    startCommand: npm run deploy
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: rukny-db
          property: connectionString
      - key: PORT
        value: 3000

databases:
  - name: rukny-db
    databaseName: rukny
    user: rukny
    region: frankfurt
