[build]
builder = "nixpacks"
buildCommand = "rm -rf node_modules && npm ci && npx prisma generate && npm run build"

[deploy]
startCommand = "npx prisma generate && npx prisma migrate deploy && npm run start:prod"
healthcheckPath = "/health"
healthcheckTimeout = 300
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 10
